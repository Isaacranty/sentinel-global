! ===== SSH REMOTE MANAGEMENT LAB =====
! R1 managed remotely instead of via console cable. Mgmt PC = 192.168.1.50
!
enable
configure terminal
hostname R1
ip domain-name secplatform.local
crypto key generate rsa
! (when prompted for modulus size, enter: 1024)
username admin privilege 15 secret StrongPass123
line vty 0 4
 transport input ssh
 login local
exit
ip ssh version 2
line console 0
 password ConsolePass123
 login
exit
end
write memory
!
! ----- VERIFY -----
! show ip ssh
! show crypto key mypubkey rsa
! From Mgmt PC Command Prompt: ssh -l admin 192.168.1.1
