! ===== PORT SECURITY LAB =====
! SW1 Fa0/1 locked to a single trusted PC's MAC; violation shuts the port
!
enable
configure terminal
hostname SW1
interface fastEthernet 0/1
 switchport mode access
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
exit
end
write memory
!
! ----- VIOLATION MODE OPTIONS -----
! switchport port-security violation protect    (drops offending traffic silently)
! switchport port-security violation restrict   (drops + logs + counts)
! switchport port-security violation shutdown   (err-disables the port, default)
!
! ----- RECOVER A PORT AFTER A VIOLATION SHUT IT DOWN -----
! interface fastEthernet 0/1
!  shutdown
!  no shutdown
!
! ----- VERIFY -----
! show port-security interface fastEthernet 0/1
! show port-security address
