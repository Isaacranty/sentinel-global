! ===== STANDARD ACL LAB =====
! R1: 192.168.1.0/24 (Sales, Gig0/0) blocked from reaching 192.168.2.0/24 (IT, Gig0/1)
! Standard ACLs filter on SOURCE only -> apply close to the DESTINATION
!
enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
exit
interface GigabitEthernet0/1
 ip address 192.168.2.1 255.255.255.0
 no shutdown
exit
access-list 10 deny 192.168.1.0 0.0.0.255
access-list 10 permit any
interface GigabitEthernet0/1
 ip access-group 10 out
exit
end
write memory
!
! ----- VARIANT: permit only ONE host, deny everything else -----
! access-list 20 permit host 192.168.1.50
! access-list 20 deny any
!
! ----- VERIFY -----
! show access-lists
! ping 192.168.2.1   (from 192.168.1.0/24 -> should fail)
