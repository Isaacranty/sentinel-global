! ===== NAT LAB (Static + Dynamic) =====
! R1 Gig0/0 = inside (192.168.1.0/24), Serial0/0/0 = outside (203.0.113.1)
!
enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 ip nat inside
 no shutdown
exit
interface Serial0/0/0
 ip address 203.0.113.1 255.255.255.252
 ip nat outside
 no shutdown
exit
!
! ----- STATIC NAT (one-to-one, e.g. for a web server) -----
ip nat inside source static 192.168.1.100 203.0.113.100
!
! ----- DYNAMIC NAT (shared pool of public IPs) -----
ip nat pool PUBLIC_POOL 203.0.113.10 203.0.113.20 netmask 255.255.255.252
access-list 1 permit 192.168.1.0 0.0.0.255
ip nat inside source list 1 pool PUBLIC_POOL
end
write memory
!
! ----- VERIFY -----
! show ip nat translations
! show ip nat statistics
