! ===== SITE-TO-SITE IPSEC VPN LAB =====
! R1 (HQ, 192.168.1.0/24) -- Internet -- R2 (Branch, 192.168.2.0/24)
! R1 outside 203.0.113.1 | R2 outside 203.0.113.2 | PSK: VpnKey123
!
! ----- R1 -----
enable
configure terminal
hostname R1
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
exit
crypto isakmp key VpnKey123 address 203.0.113.2
crypto ipsec transform-set TSET esp-aes 256 esp-sha256-hmac
access-list 101 permit ip 192.168.1.0 0.0.0.255 192.168.2.0 0.0.0.255
crypto map VPNMAP 10 ipsec-isakmp
 set peer 203.0.113.2
 set transform-set TSET
 match address 101
exit
interface Serial0/0/0
 crypto map VPNMAP
exit
end
write memory
!
! ----- R2 (mirror configuration) -----
! crypto isakmp policy 10
!  encryption aes 256
!  hash sha256
!  authentication pre-share
!  group 14
! crypto isakmp key VpnKey123 address 203.0.113.1
! crypto ipsec transform-set TSET esp-aes 256 esp-sha256-hmac
! access-list 101 permit ip 192.168.2.0 0.0.0.255 192.168.1.0 0.0.0.255
! crypto map VPNMAP 10 ipsec-isakmp
!  set peer 203.0.113.1
!  set transform-set TSET
!  match address 101
! interface Serial0/0/0
!  crypto map VPNMAP
!
! ----- VERIFY -----
! show crypto isakmp sa
! show crypto ipsec sa
