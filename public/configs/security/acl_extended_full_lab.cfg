! ===== EXTENDED ACL LAB =====
! LAN 192.168.1.0/24 (Gig0/0) may reach server 192.168.2.100 (Gig0/1) ONLY on 80/443
! Extended ACLs filter on source+dest+protocol+port -> apply close to SOURCE
!
enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
exit
interface GigabitEthernet0/1
 ip address 192.168.2.1 255.255.255.0
 no shutdown
exit
ip access-list extended WEB_ONLY
 permit tcp 192.168.1.0 0.0.0.255 host 192.168.2.100 eq 80
 permit tcp 192.168.1.0 0.0.0.255 host 192.168.2.100 eq 443
 deny ip 192.168.1.0 0.0.0.255 host 192.168.2.100
 permit ip any any
exit
interface GigabitEthernet0/0
 ip access-group WEB_ONLY in
exit
end
write memory
!
! ----- VARIANT: numbered extended ACL (equivalent) -----
! access-list 110 permit tcp 192.168.1.0 0.0.0.255 host 192.168.2.100 eq 80
! access-list 110 permit tcp 192.168.1.0 0.0.0.255 host 192.168.2.100 eq 443
! access-list 110 deny ip 192.168.1.0 0.0.0.255 host 192.168.2.100
! access-list 110 permit ip any any
!
! ----- VERIFY -----
! show access-lists WEB_ONLY
! (in PT simulation mode: HTTP passes, ping to .100 fails)
