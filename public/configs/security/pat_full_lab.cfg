! ===== PAT LAB (NAT Overload) =====
! R1 Gig0/0 = inside (192.168.1.0/24), Serial0/0/0 = outside, ONE public IP shared
!
enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 ip nat inside
 no shutdown
exit
interface Serial0/0/0
 ip address 203.0.113.1 255.255.255.252
 ip nat outside
 no shutdown
exit
access-list 1 permit 192.168.1.0 0.0.0.255
ip nat inside source list 1 interface Serial0/0/0 overload
end
write memory
! "overload" = PAT: many inside hosts share ONE outside IP, differentiated by port
!
! ----- VERIFY -----
! show ip nat translations
! show ip nat statistics
! debug ip nat   (then "undebug all" when done)
