! ===== HSRP (FIRST-HOP REDUNDANCY) LAB =====
! R1 + R2 share LAN 192.168.1.0/24 | Virtual gateway 192.168.1.1 | R1 = Active
!
! ----- R1 (Active) -----
enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 ip address 192.168.1.2 255.255.255.0
 no shutdown
 standby 1 ip 192.168.1.1
 standby 1 priority 110
 standby 1 preempt
exit
end
write memory
!
! ----- R2 (Standby) -----
enable
configure terminal
hostname R2
interface GigabitEthernet0/0
 ip address 192.168.1.3 255.255.255.0
 no shutdown
 standby 1 ip 192.168.1.1
 standby 1 priority 100
 standby 1 preempt
exit
end
write memory
!
! PCs on this LAN: set default gateway = 192.168.1.1 (virtual HSRP IP)
!
! ----- VERIFY -----
! show standby brief
! show standby
! (test failover: shut R1 Gig0/0, confirm R2 becomes Active)
