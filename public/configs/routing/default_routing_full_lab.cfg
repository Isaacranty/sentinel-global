! ===== DEFAULT ROUTING LAB =====
! Branch router R2 has ONE uplink to HQ R1 (stub network) -> use a default route
!
! ----- R2 (stub / branch) -----
enable
configure terminal
hostname R2
interface Serial0/0/0
 ip address 10.0.0.2 255.255.255.252
 no shutdown
exit
ip route 0.0.0.0 0.0.0.0 10.0.0.1
end
write memory
!
! ----- R1 (HQ, knows the specific branch route back) -----
enable
configure terminal
ip route 192.168.2.0 255.255.255.0 10.0.0.2
end
write memory
!
! ----- VERIFY -----
! show ip route
! show ip route 0.0.0.0
