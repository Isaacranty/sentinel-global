! ===== VRRP (OPEN-STANDARD FIRST-HOP REDUNDANCY) LAB =====
! R1 + R2 share LAN 192.168.1.0/24 | Virtual gateway 192.168.1.1 | R1 = Master
!
! ----- R1 (Master) -----
enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 ip address 192.168.1.2 255.255.255.0
 no shutdown
 vrrp 1 ip 192.168.1.1
 vrrp 1 priority 110
 vrrp 1 preempt
exit
end
write memory
!
! ----- R2 (Backup) -----
enable
configure terminal
hostname R2
interface GigabitEthernet0/0
 ip address 192.168.1.3 255.255.255.0
 no shutdown
 vrrp 1 ip 192.168.1.1
 vrrp 1 priority 100
 vrrp 1 preempt
exit
end
write memory
!
! PCs on this LAN: set default gateway = 192.168.1.1 (virtual VRRP IP)
!
! ----- VERIFY -----
! show vrrp brief
! show vrrp
! (test failover: shut R1 Gig0/0, confirm R2 becomes Master)
