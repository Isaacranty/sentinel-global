! ===== EIGRP LAB (3-router chain, AS 100) =====
! R1 -- 10.0.12.0/30 -- R2 -- 10.0.23.0/30 -- R3
! R1 LAN 192.168.1.0/24 | R3 LAN 192.168.3.0/24
!
! ----- R1 -----
enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
exit
interface Serial0/0/0
 ip address 10.0.12.1 255.255.255.252
 clock rate 64000
 no shutdown
exit
router eigrp 100
 network 192.168.1.0 0.0.0.255
 network 10.0.12.0 0.0.0.3
 no auto-summary
end
write memory
!
! ----- R2 -----
enable
configure terminal
hostname R2
interface Serial0/0/0
 ip address 10.0.12.2 255.255.255.252
 no shutdown
exit
interface Serial0/0/1
 ip address 10.0.23.1 255.255.255.252
 clock rate 64000
 no shutdown
exit
router eigrp 100
 network 10.0.12.0 0.0.0.3
 network 10.0.23.0 0.0.0.3
 no auto-summary
end
write memory
!
! ----- R3 -----
enable
configure terminal
hostname R3
interface GigabitEthernet0/0
 ip address 192.168.3.1 255.255.255.0
 no shutdown
exit
interface Serial0/0/0
 ip address 10.0.23.2 255.255.255.252
 no shutdown
exit
router eigrp 100
 network 192.168.3.0 0.0.0.255
 network 10.0.23.0 0.0.0.3
 no auto-summary
end
write memory
!
! ----- OPTIONAL: passive interface -----
! router eigrp 100
!  passive-interface GigabitEthernet0/0
!
! ----- VERIFY -----
! show ip eigrp neighbors
! show ip route eigrp
! show ip eigrp topology
