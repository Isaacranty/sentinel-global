! ===== STP (SPANNING TREE PROTOCOL) LAB =====
! SW1, SW2, SW3 in a triangle (redundant links). SW1 forced to Root Bridge.
!
enable
configure terminal
hostname SW1
spanning-tree mode pvst
spanning-tree vlan 1 priority 4096
end
write memory
!
! ----- SW2 (secondary root / backup) -----
! spanning-tree mode pvst
! spanning-tree vlan 1 priority 8192
!
! ----- SW3 (default priority) -----
! spanning-tree mode pvst
!
! ----- OPTIONAL: PortFast + BPDU Guard on access ports facing end devices -----
! interface fastEthernet 0/1
!  spanning-tree portfast
!  spanning-tree bpduguard enable
!
! ----- VERIFY -----
! show spanning-tree vlan 1
! show spanning-tree summary
