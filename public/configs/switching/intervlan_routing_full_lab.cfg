! ===== INTER-VLAN ROUTING LAB (Router-on-a-Stick) =====
! SW1 Fa0/24 (trunk) -> R1 Gig0/0 | VLAN10 192.168.10.0/24 | VLAN20 192.168.20.0/24
!
! ----- SW1 -----
enable
configure terminal
interface fastEthernet 0/24
 switchport mode trunk
end
write memory
!
! ----- R1 (Router-on-a-Stick) -----
enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 no shutdown
exit
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
exit
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
exit
end
write memory
!
! ----- ALTERNATIVE: Layer 3 switch SVI method (no router needed) -----
! ip routing
! interface vlan 10
!  ip address 192.168.10.1 255.255.255.0
!  no shutdown
! interface vlan 20
!  ip address 192.168.20.1 255.255.255.0
!  no shutdown
!
! ----- VERIFY -----
! show ip interface brief
! show vlan brief
! ping 192.168.20.10
