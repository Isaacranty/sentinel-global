! ===== WAN CONFIGURATION LAB =====
! Topology: R1 (HQ) --Serial0/0/0-- R2 (Branch)
! R1 LAN 192.168.1.0/24 | R2 LAN 192.168.2.0/24 | WAN link 10.0.0.0/30
!
! ----- R1 -----
enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
exit
interface Serial0/0/0
 ip address 10.0.0.1 255.255.255.252
 encapsulation ppp
 clock rate 64000
 no shutdown
exit
ip route 192.168.2.0 255.255.255.0 10.0.0.2
end
write memory
!
! ----- R2 -----
enable
configure terminal
hostname R2
interface GigabitEthernet0/0
 ip address 192.168.2.1 255.255.255.0
 no shutdown
exit
interface Serial0/0/0
 ip address 10.0.0.2 255.255.255.252
 encapsulation ppp
 no shutdown
exit
ip route 192.168.1.0 255.255.255.0 10.0.0.1
end
write memory
!
! ----- OPTIONAL: PPP with CHAP authentication -----
! username R2 password cisco123     (on R1, use the OTHER router's hostname)
! username R1 password cisco123     (on R2)
! interface Serial0/0/0
!  ppp authentication chap
!
! ----- VERIFY -----
! show interfaces serial0/0/0
! show ip route
! ping 192.168.2.1
