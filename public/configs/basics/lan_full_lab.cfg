! ===== LAN CONFIGURATION LAB =====
! Topology: SW1 (2960) -- R1 Gig0/0
! PCs on SW1 Fa0/1, Fa0/2 | LAN subnet 192.168.1.0/24, R1 Gig0/0 = .1
!
! ----- R1 -----
enable
configure terminal
hostname R1
interface GigabitEthernet0/0
 ip address 192.168.1.1 255.255.255.0
 no shutdown
exit
end
write memory
!
! ----- SW1 -----
enable
configure terminal
hostname SW1
interface range fastEthernet 0/1-2
 switchport mode access
 no shutdown
exit
interface vlan 1
 ip address 192.168.1.2 255.255.255.0
 no shutdown
exit
ip default-gateway 192.168.1.1
end
write memory
!
! ----- PC1 / PC2 (set via Desktop > IP Configuration, not CLI) -----
! PC1: 192.168.1.10 / 255.255.255.0 / gw 192.168.1.1
! PC2: 192.168.1.11 / 255.255.255.0 / gw 192.168.1.1
!
! ----- VERIFY -----
! show ip interface brief
! show vlan brief
! ping 192.168.1.11
