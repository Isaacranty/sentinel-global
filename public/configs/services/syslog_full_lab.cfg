! ===== SYSLOG SERVER LAB =====
! R1 generates logs, Syslog Server (PT "Server" device) = 192.168.1.50
!
enable
configure terminal
hostname R1
logging host 192.168.1.50
logging trap informational
logging on
service timestamps log datetime msec
end
write memory
!
! On the Syslog Server: Services tab > SYSLOG > turn Service ON
!
! ----- GENERATE A TEST LOG MESSAGE -----
! interface GigabitEthernet0/1
!  shutdown
!  no shutdown
! (bringing an interface down/up generates a %LINK-3-UPDOWN log entry)
!
! ----- VERIFY -----
! show logging
! (check Syslog Server Services > SYSLOG tab for received entries)
