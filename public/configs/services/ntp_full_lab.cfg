! ===== NTP LAB =====
! R1 = NTP master, R2 = NTP client syncing over the WAN link (10.0.0.0/30)
!
! ----- R1 (NTP Server / Master) -----
enable
configure terminal
hostname R1
clock set 14:00:00 21 JUL 2026
ntp master 3
end
write memory
!
! ----- R2 (NTP Client) -----
enable
configure terminal
hostname R2
ntp server 10.0.0.1
end
write memory
!
! ----- OPTIONAL: set timezone -----
! clock timezone EAT 3
!
! ----- VERIFY (on R2, after a minute or two) -----
! show ntp associations
! show ntp status
! show clock
