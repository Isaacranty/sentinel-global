! ===== DHCP RELAY AGENT LAB =====
! DHCP server lives on a DIFFERENT subnet than the clients.
! R1 (HQ) hosts the pool for the branch subnet; R2 (branch) relays requests.
!
! ----- R1 (hosts DHCP pool for the BRANCH subnet) -----
enable
configure terminal
hostname R1
ip dhcp excluded-address 192.168.2.1 192.168.2.10
ip dhcp pool BRANCH_POOL
 network 192.168.2.0 255.255.255.0
 default-router 192.168.2.1
 dns-server 8.8.8.8
exit
end
write memory
!
! ----- R2 (branch router, relays broadcasts as unicast to R1) -----
enable
configure terminal
hostname R2
interface GigabitEthernet0/0
 ip address 192.168.2.1 255.255.255.0
 ip helper-address 10.0.0.1
 no shutdown
exit
end
write memory
! ip helper-address = the single command that makes a router a DHCP relay agent
!
! ----- VERIFY -----
! show ip interface GigabitEthernet0/0 | include Helper
! show ip dhcp binding   (on R1)
