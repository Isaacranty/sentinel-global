! ===== QoS LAB (MQC — prioritize VoIP over bulk data) =====
! R1 WAN edge, Serial0/0/0 is the constrained link
!
enable
configure terminal
hostname R1
class-map match-any VOICE
 match ip dscp ef
 match access-group 100
exit
class-map match-any CRITICAL_DATA
 match access-group 101
exit
access-list 100 permit udp any any range 16384 32767
access-list 101 permit tcp any any eq 22
access-list 101 permit tcp any any eq 443
policy-map WAN_QOS
 class VOICE
  priority percent 30
 class CRITICAL_DATA
  bandwidth percent 40
 class class-default
  fair-queue
interface Serial0/0/0
 service-policy output WAN_QOS
exit
end
write memory
!
! ----- VERIFY -----
! show policy-map interface Serial0/0/0
! show policy-map WAN_QOS
! show class-map
