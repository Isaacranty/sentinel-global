! ===== SNMP LAB =====
! R1 = managed device, NMS/PC = 192.168.1.50, SNMPv2c RO/RW community strings
!
enable
configure terminal
hostname R1
snmp-server community NETADMIN_RO RO
snmp-server community NETADMIN_RW RW
snmp-server location "Server Room, HQ"
snmp-server contact "netadmin@example.com"
snmp-server host 192.168.1.50 version 2c NETADMIN_RO
snmp-server enable traps
end
write memory
!
! ----- SECURITY NOTE: SNMPv2c is plaintext. Prefer SNMPv3 in real deployments -----
! snmp-server group ADMIN_GROUP v3 priv
! snmp-server user netadmin ADMIN_GROUP v3 auth sha AuthPass123 priv aes 128 PrivPass123
!
! ----- VERIFY -----
! show snmp
! show running-config | include snmp
